<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Call Transcripts</title>
<style>
  :root { color-scheme: light dark; --line: #d6dce1; --muted: #657e91; --accent: #158fcf; --live: #c70816; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; font: 14px/1.45 'Open Sans', system-ui, sans-serif; background: Canvas; color: CanvasText; }
  nav { width: 220px; border-right: 1px solid var(--line); overflow-y: auto; flex: none; }
  nav button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; }
  nav button.on { background: rgba(21, 143, 207, .15); }
  nav small, .muted { color: var(--muted); }
  nav .row { display: flex; align-items: baseline; gap: 8px; }
  nav .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .len { flex: none; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
  .live .len { color: var(--live); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 6px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header div { flex: 1; min-width: 0; }
  #lines { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .line { margin: 0 0 10px; max-width: 80%; padding: 7px 10px; border-radius: 10px; background: rgba(127, 127, 127, .14); }
  .line.you { margin-left: auto; background: rgba(21, 143, 207, .18); }
  .line b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #status { padding: 6px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  #status.error { color: var(--live); }
  button.small { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px; background: ButtonFace; color: ButtonText; cursor: pointer; }
</style>
</head>
<body>
<nav id="list"></nav>
<main>
  <header><div id="title" class="muted">No conversation selected</div><button class="small" id="copy" hidden>Copy</button><button class="small" id="remove" hidden>Delete</button></header>
  <div id="lines"></div>
  <div id="status" class="muted"></div>
</main>
<script>
let state = { conversations: [], liveIds: [] }, selected = null, follow = true;
const $ = id => document.getElementById(id);
const time = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const day = t => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const who = c => c.display || c.number || 'Unknown caller';
// How long the call has lasted since it was answered, like the app's own timer: 4:07, 1:02:33.
const two = n => String(n).padStart(2, '0');
function length(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return h ? `${h}:${two(m)}:${two(s % 60)}` : `${m}:${two(s % 60)}`;
}
const lengthOf = (c, live) => (live ? length(Date.now() - c.startedAt) : c.endedAt ? length(c.endedAt - c.startedAt) : '');
const lenSpan = (c, live) => Object.assign(document.createElement('span'), { className: 'len', textContent: lengthOf(c, live), title: 'Call length' });

function render() {
  const live = new Set(state.liveIds);
  if (follow && state.liveIds.length) selected = state.liveIds[state.liveIds.length - 1];
  if (!state.conversations.some(c => c.id === selected)) selected = state.conversations.at(-1)?.id ?? null;
  const list = $('list');
  list.replaceChildren();
  for (const c of [...state.conversations].reverse()) {
    const b = document.createElement('button'), on = live.has(c.id);
    b.className = (c.id === selected ? 'on' : '') + (on ? ' live' : '');
    const row = Object.assign(document.createElement('div'), { className: 'row' });
    const name = Object.assign(document.createElement('span'), { className: 'name', textContent: who(c), title: who(c) });
    if (on) name.prepend(Object.assign(document.createElement('span'), { className: 'dot', title: 'Transcribing' }));
    row.append(name, lenSpan(c, on));
    b.append(row, Object.assign(document.createElement('small'), { textContent: `${day(c.startedAt)} · ${c.lines.length} lines` }));
    b.dataset.id = c.id;
    b.onclick = () => { selected = c.id; follow = live.has(c.id); render(); };
    list.append(b);
  }
  const c = state.conversations.find(x => x.id === selected);
  $('title').textContent = c ? `${who(c)}${c.number && c.display ? ` (${c.number})` : ''} · ${day(c.startedAt)}${live.has(c.id) ? ' · transcribing…' : ''}` : 'No conversation yet. Transcripts appear here during a call.';
  if (c) $('title').append(' ', lenSpan(c, live.has(c.id)));
  $('title').dataset.id = c ? c.id : '';
  $('copy').hidden = $('remove').hidden = !c;
  const lines = $('lines'), atEnd = lines.scrollHeight - lines.scrollTop - lines.clientHeight < 60;
  lines.replaceChildren();
  for (const l of c ? c.lines : []) {
    const p = document.createElement('p');
    p.className = 'line' + (l.speaker === 'You' ? ' you' : '');
    p.append(Object.assign(document.createElement('b'), { textContent: `${l.speaker} · ${time(l.at)}` }), l.text);
    lines.append(p);
  }
  if (atEnd) lines.scrollTop = lines.scrollHeight;
  const status = $('status');
  status.className = state.error || state.noAudio ? 'error' : 'muted';
  status.textContent = state.noAudio ? 'No audio is arriving from this call. Switch the plugin off and on under Plugins; if that does not help, the app needs a restart after the call.'
    : state.error ? `Transcription problem: ${state.error}`
    : state.server && state.server.using === 'fallback' ? `Using the second server: ${state.server.mainError || 'the first one is not answering'}`
    : (state.saving ? `Saved in ${state.folder}` : 'Kept in memory until Sangoma Phone closes') + (state.evicted ? ` · ${state.evicted} older conversation(s) dropped from memory to make room` : '');
}
$('copy').onclick = () => {
  const c = state.conversations.find(x => x.id === selected);
  if (!c) return;
  const len = lengthOf(c, state.liveIds.includes(c.id));
  const text = [`${who(c)}${c.number && c.display ? ` (${c.number})` : ''} · ${day(c.startedAt)}${len ? ` · ${len}` : ''}`, ...c.lines.map(l => `[${time(l.at)}] ${l.speaker}: ${l.text}`)].join('\n');
  window.plugin.invoke('copy', text).then(() => {
    $('copy').textContent = 'Copied';
    setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
  }).catch(e => { $('status').className = 'error'; $('status').textContent = `Could not copy: ${e.message}`; });
};
// Two clicks instead of a system dialog: the first arms the button for three seconds.
let armed = null;
$('remove').onclick = () => {
  if (!selected) return;
  if (armed !== selected) {
    armed = selected;
    $('remove').textContent = 'Really delete?';
    setTimeout(() => { armed = null; $('remove').textContent = 'Delete'; }, 3000);
    return;
  }
  armed = null;
  $('remove').textContent = 'Delete';
  window.plugin.invoke('remove', selected);
};
// Calls in progress: their length counts up (only those numbers change, so a selection in the text stays).
setInterval(() => {
  const live = new Set(state.liveIds);
  if (!live.size) return;
  for (const el of document.querySelectorAll('[data-id]')) {
    const c = live.has(el.dataset.id) && state.conversations.find(x => x.id === el.dataset.id);
    const len = c && el.querySelector('.len');
    if (len) len.textContent = lengthOf(c, true);
  }
}, 1000);
window.plugin.on('state', s => { state = s; render(); });
window.plugin.invoke('state').then(s => { state = s; render(); });
</script>
</body>
</html>
